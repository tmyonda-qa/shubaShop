<div class="filters">
  <div class="filters__header" (click)="toggle()">
    <h3 class="filters__title">
      Фільтри
      <span class="filters__arrow" [class.open]="open()">▾</span>
    </h3>
    <button class="filters__reset" (click)="reset(); $event.stopPropagation()">Скинути</button>
  </div>

  <div class="filters__body" [class.open]="open()">
    <div class="filters__group">
      <h4 class="filters__group-title">Капюшон</h4>
      <label class="filters__option">
        <input type="radio" name="hood" value="Вшитий" (change)="hood.set('Вшитий')" [checked]="hood() === 'Вшитий'" />
        Вшитий
      </label>
      <label class="filters__option">
        <input type="radio" name="hood" value="Без капюшона" (change)="hood.set('Без капюшона')" [checked]="hood() === 'Без капюшона'" />
        Без капюшона
      </label>
    </div>

    <div class="filters__group">
      <h4 class="filters__group-title">Вид хутра</h4>
      <label class="filters__option">
        <input type="radio" name="fur_type" value="Нутрія" (change)="furType.set('Нутрія')" [checked]="furType() === 'Нутрія'" />
        Нутрія
      </label>
      <label class="filters__option">
        <input type="radio" name="fur_type" value="Норка" (change)="furType.set('Норка')" [checked]="furType() === 'Норка'" />
        Норка
      </label>
      <label class="filters__option">
        <input type="radio" name="fur_type" value="Лисиця" (change)="furType.set('Лисиця')" [checked]="furType() === 'Лисиця'" />
        Лисиця
      </label>
      <label class="filters__option">
        <input type="radio" name="fur_type" value="Каракуль" (change)="furType.set('Каракуль')" [checked]="furType() === 'Каракуль'" />
        Каракуль
      </label>
    </div>

    <div class="filters__group">
      <h4 class="filters__group-title">Тип</h4>
      <label class="filters__option">
        <input type="radio" name="type" value="Шуба" (change)="type.set('Шуба')" [checked]="type() === 'Шуба'" />
        Шуба
      </label>
      <label class="filters__option">
        <input type="radio" name="type" value="Напівшубок" (change)="type.set('Напівшубок')" [checked]="type() === 'Напівшубок'" />
        Напівшубок
      </label>
    </div>

    <div class="filters__group">
      <h4 class="filters__group-title">Ціна, грн</h4>
      <div class="filters__price">
        <input
          type="number"
          placeholder="Від"
          [value]="priceFrom()"
          (input)="priceFrom.set($any($event.target).value)"
          class="filters__price-input"
        />
        <span>—</span>
        <input
          type="number"
          placeholder="До"
          [value]="priceTo()"
          (input)="priceTo.set($any($event.target).value)"
          class="filters__price-input"
        />
      </div>
    </div>

    <button class="filters__apply" (click)="apply()">Застосувати</button>
  </div>
</div>
