<div class="header-top">
  <div class="container">
    <div class="header-top__inner">

      <div class="header-top__center">
        <a href="tel:+380962969899" class="header-top__phone">
          <i class="fas fa-phone"></i>
          +38 (096) 296-98-99
        </a>
        <a href="viber://chat?number=%2B380962969899" class="social-icon viber" title="Viber">
          <i class="fab fa-viber"></i>
        </a>
        <a href="https://t.me/your_telegram" target="_blank" class="social-icon telegram" title="Telegram">
          <i class="fab fa-telegram"></i>
        </a>
        <a href="https://www.facebook.com/people/%D0%A8%D1%83%D0%B1%D0%BA%D0%B0-%D0%A2%D0%B8%D1%81%D0%BC%D0%B5%D0%BD%D0%B8%D1%86%D1%8F/100059144528985/" target="_blank" class="social-icon facebook" title="Facebook">
          <i class="fab fa-facebook"></i>
        </a>
        <a routerLink="/contacts" class="header-top__contacts-link">Контакти</a>
      </div>

      <div class="header-top__auth">
        @if (auth.isLoggedIn()) {
          @if (auth.isAdmin()) {
            <a routerLink="/admin/dashboard" class="btn-admin">
              <i class="fas fa-user-shield"></i>
              Адмін панель
              @if (adminService.newOrders() > 0) {
                <span class="btn-admin__badge">{{adminService.newOrders()}}</span>
              }
            </a>
          }
          <button (click)="logout()" class="btn-logout">Вийти</button>
        } @else {
          <a routerLink="/login" class="btn-login">Вхід</a>
          <a routerLink="/register" class="btn-register">Реєстрація</a>
        }
      </div>

    </div>
  </div>
</div>
