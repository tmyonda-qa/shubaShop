<div class="header-main">
  <div class="container">
    <div class="header-main__inner">
      <a routerLink="/" class="logo">
        <span class="logo__text">Шубка Тисмениця</span>
      </a>

      <div class="header-main__search">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keydown)="onKeyDown($event)"
          placeholder="Пошук за артикулом, номером або назвою..."
          class="search-input"
        />
        <button class="search-btn" (click)="onSearch()">
          <i class="fas fa-search"></i>
        </button>
        <a routerLink="/cart" class="cart-link" title="Кошик">
          <i class="fas fa-shopping-bag"></i>
          @if (cart.count() > 0) {
            <span class="cart-link__badge">{{cart.count()}}</span>
          }
        </a>
      </div>
    </div>
  </div>
</div>
